name: Test Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run a successful step
      run: echo "Starting test suite..."

    - name: Simulate Build Failure
      run: |
        echo "Running database migration..."
        echo "ERROR: Connection refused at 127.0.0.1:5432"
        echo "FatalError: Migration failed due to missing DB_PASSWORD environment variable."
        exit 1
